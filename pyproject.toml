[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project]
name = "kanitor"
version = "0.1.0"
description = "A kanbn terminal explorer with durable work recording"
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18,<5",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.urls]
Repository = "https://github.com/yetanothercolin/kanitor"

[project.scripts]
kanitor = "kanitor.__main__:main"

[tool.uv.build-backend]
module-root = ""
